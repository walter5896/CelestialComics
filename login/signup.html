<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>

      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>

      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li class="profile-link" style="display:none;">
            <a href="/profile/">My Profile</a>
          </li>
          <li class="admin-link" style="display:none;">
            <a href="/admin/index.html">Admin Panel</a>
          </li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container auth-page">
    <h1>Create an Account</h1>
    <form id="signup-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p>Already have an account? <a href="/login/">Login here</a></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- Utils -->
  <script type="module" src="/js/utils.js"></script>

  <!-- Signup/Auth UI -->
  <script type="module">
    import { signup } from '/js/auth-signup.js';
    import { updateUI, logout } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      updateUI();

      const form = document.getElementById('signup-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const success = await signup(email, password);
        if (success) window.location.href = '/';
      });

      document.querySelectorAll('.logout-link').forEach(el => {
        el.addEventListener('click', async (e) => {
          e.preventDefault();
          await logout();
        });
      });
    });
  </script>

  <!-- ADMIN NAV LINK -->
  <script type="module" src="/js/admin-nav.js"></script>
</body>
</html>
