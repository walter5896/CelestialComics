<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/login/">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="container auth-page">
    <h1>Create an Account</h1>
    <form id="signup-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p>Already have an account? <a href="/login/">Login here</a></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
    </div>
  </footer>

  <!-- ENV (must load before Supabase) -->
  <script src="/js/env.js"></script>

  <script type="module">
    import { signup } from '/js/auth-signup.js';

    const form = document.getElementById('signup-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const success = await signup(email, password);
      if (success) window.location.href = '/'; // redirect to home after signup
    });
  </script>
</body>
</html>
