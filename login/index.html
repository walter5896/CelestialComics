<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>

      <!-- Hamburger for mobile -->
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>

      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>

          <!-- Login / Logout / Profile links -->
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
          <li class="profile-link" style="display:none;">
            <a href="/profile/">My Profile</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- LOGIN FORM -->
  <main class="login-page">
    <div class="container login-container">
      <h1>Login to Your Account</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <p class="login-footer">
        Don't have an account? <a href="/login/signup.html">Sign up</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
    </div>
  </footer>

  <!-- AUTH SCRIPT -->
  <script type="module">
    import { login, logout, updateUI } from '/js/auth.js';

    // Update login/logout/profile links on page load
    updateUI();

    // Handle login form submission
    const form = document.getElementById('login-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const success = await login(email, password);
      if (success) window.location.href = '/';
    });

    // Logout link functionality
    document.querySelectorAll('.logout-link').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
      });
    });
  </script>
</body>
</html>
