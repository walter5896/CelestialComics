<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Celestial Comics</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>

      <!-- Hamburger for mobile -->
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>

      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/history/">History</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li class="profile-link" style="display:none;">
            <a href="/profile/">My Profile</a>
          </li>
          <li class="admin-link" style="display:none;">
            <a href="/admin/index.html">Admin Panel</a>
          </li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none;">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- LOGIN FORM -->
  <main class="login-page">
    <div class="container login-container">
      <h1>Login to Your Account</h1>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <p class="login-footer">
        Don't have an account? <a href="/login/signup.html">Sign up</a>
      </p>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Celestial Comics. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/history/">History</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- SHARED UI / NAV -->
  <script type="module" src="/js/utils.js"></script>

  <!-- AUTH SCRIPT -->
  <script type="module">
    import { login, logout, updateUI } from '/js/auth.js';

    // =========================
    // LOGIN PAGE INITIALIZER
    // =========================
    // Updates auth-aware navigation, wires logout behavior,
    // and handles login form submission.
    document.addEventListener('DOMContentLoaded', () => {
      updateUI();

      const form = document.getElementById('login-form');

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email')?.value || '';
        const password = document.getElementById('password')?.value || '';

        const success = await login(email, password);

        if (success) {
          window.location.href = '/';
        }
      });

      document.querySelectorAll('.logout-link').forEach((el) => {
        el.addEventListener('click', async (e) => {
          e.preventDefault();
          await logout();
          window.location.href = '/';
        });
      });
    });
  </script>

  <!-- ADMIN NAV LINK -->
  <script type="module" src="/js/admin-nav.js"></script>
</body>
</html>
