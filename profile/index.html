<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li class="profile-link" style="display:none;"><a href="/profile/">My Profile</a></li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="page-container">
    <section class="profile-stories">
      <div class="container">
        <h2>My Saved Stories</h2>
        <div id="story-grid" class="story-grid"></div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- APP JS -->
  <script type="module">
    import { updateUI, logout, getCurrentUserAsync } from '/js/auth.js';
    import { fetchSavedStories, renderStories, saveStory, unsaveStory } from '/js/vote.js';

    updateUI();

    document.querySelectorAll('.logout-link').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
      });
    });

    async function loadProfileStories() {
      const container = document.getElementById('story-grid');
      const { success, data: stories } = await fetchSavedStories();
      if (!success || stories.length === 0) {
        container.innerHTML = '<p>You have no saved stories.</p>';
        return;
      }

      // Mark stories as saved
      stories.forEach(s => s.isSaved = true);

      renderStories(stories, 'story-grid');

      // Setup save/unsave toggle
      container.querySelectorAll('.save-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const storyId = btn.dataset.storyId;
          if (btn.textContent === 'Saved') {
            await unsaveStory(storyId);
            btn.textContent = 'Save Story';
          } else {
            await saveStory(storyId);
            btn.textContent = 'Saved';
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', loadProfileStories);
  </script>
</body>
</html>
