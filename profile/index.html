<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li><a href="/profile/">My Profile</a></li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN PROFILE DASHBOARD -->
  <main class="container">
    <section>
      <h2>My Votes</h2>
      <div id="voted-stories" class="story-grid"></div>
      <p id="no-votes" style="display:none;">You haven’t voted for any stories yet.</p>
    </section>

    <section>
      <h2>Saved Stories</h2>
      <div id="saved-stories" class="story-grid"></div>
      <p id="no-saved" style="display:none;">You haven’t saved any stories yet.</p>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- JS MODULES -->
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/vote.js"></script>

  <script type="module">
    import { getCurrentUserAsync, updateUI, logout } from '/js/auth.js';
    import { fetchStoriesWithVotes, fetchUserVotes, fetchSavedStories, renderStoriesForProfile, attachRecantListeners, attachUnsaveListeners } from '/js/vote.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // Update login/logout links
      updateUI();

      document.querySelectorAll('.logout-link').forEach(el => {
        el.addEventListener('click', async e => {
          e.preventDefault();
          await logout();
          location.reload();
        });
      });

      const user = await getCurrentUserAsync();
      if (!user) {
        alert('Please log in to view your profile.');
        window.location.href = '/login/';
        return;
      }

      // Fetch user's voted stories
      const allStories = await fetchStoriesWithVotes();
      const userVotesIds = await fetchUserVotes();
      const votedStories = allStories.filter(s => userVotesIds.includes(String(s.id)));

      // Fetch saved stories
      const savedData = await fetchSavedStories();
      const savedStories = savedData.success ? savedData.data : [];

      // Render profile sections
      renderStoriesForProfile(votedStories, savedStories, 'voted-stories', 'saved-stories');

      // Show/hide empty messages
      document.getElementById('no-votes').style.display = votedStories.length === 0 ? 'block' : 'none';
      document.getElementById('no-saved').style.display = savedStories.length === 0 ? 'block' : 'none';

      // Attach recant/unsave button listeners
      attachRecantListeners('voted-stories');
      attachUnsaveListeners('saved-stories');
    });
  </script>
</body>
</html>
