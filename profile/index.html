<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/profile/">My Profile</a></li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN DASHBOARD -->
  <main class="container">
    <h2>My Votes</h2>
    <ul id="vote-list">
      <!-- User votes will be populated here -->
    </ul>
    <p id="no-votes" style="display:none;">You haven’t voted for any stories yet.</p>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- JS FILES -->
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/profile.js"></script>
  <script type="module">
    import { updateUI, logout } from '/js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Update login/logout links
      updateUI();

      // Logout button functionality
      document.querySelectorAll('.logout-link').forEach(el => {
        el.addEventListener('click', async (e) => {
          e.preventDefault();
          await logout();
        });
      });
    });
  </script>
</body>
</html>
