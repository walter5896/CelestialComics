<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Winner | Project Name</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .winner-page { padding: 2rem 1rem; max-width: 800px; margin: auto; }
    .story-card { background: #fff; padding: 1.5rem; border-radius: 0.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 1.5rem; text-align: center; }
    .story-card img { max-width: 100%; border-radius: 0.5rem; margin-bottom: 1rem; }
    .btn { display: inline-block; padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; font-weight: 600; margin: 0.25rem; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #6b7280; color: white; }
    .winner-empty { font-size: 1.25rem; text-align: center; margin: 2rem 0; color: #374151; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- WINNER SECTION -->
  <main class="container winner-page">

    <!-- Empty winner message -->
    <div id="winner-empty" class="winner-empty" style="display:none;">
      🏆 No winner has been determined yet. Check back after the voting period ends!
    </div>

    <!-- Winner details -->
    <section id="winner-details" style="display:none;">
      <div class="story-card">
        <img id="winner-image" src="" alt="Winning Story" />
        <h2 id="winner-name">Winning Story Title</h2>
        <p id="winner-story">Winning story description goes here.</p>
        <a href="/gallery/story.html" class="btn btn-primary" id="winner-link">Read Full Story</a>
      </div>

      <div style="text-align:center; margin-top:1rem;">
        <a href="/vote/" class="btn btn-secondary">Back to Vote</a>
        <a href="/gallery/" class="btn btn-secondary">Back to Gallery</a>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer" style="text-align:center; padding:2rem 1rem; background:#f3f4f6;">
    <p>&copy; 2025 Project Name. All rights reserved.</p>
    <nav class="footer-nav">
      <a href="/gallery/">Gallery</a> |
      <a href="/vote/">Vote</a> |
      <a href="/shop/">Shop</a> |
      <a href="/team/">Team</a>
    </nav>
  </footer>

  <!-- JS files -->
  <script type="module" src="/js/winner.js"></script>
</body>
</html>
