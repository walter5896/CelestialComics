<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
    th { background: #f4f4f4; }
    select { padding: 0.25rem; }
    button { padding: 0.25rem 0.5rem; }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  <p id="status-message">Loading...</p>

  <table id="users-table" style="display:none;">
    <thead>
      <tr>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- MUST load env first -->
  <script src="/js/env.js"></script>

  <script type="module">
    import { getCurrentUserAsync } from '../js/auth.js';
    import { supabase } from '../js/supabase.js';
    import { initAdminPanel } from '../js/admin.js';

    (async () => {
      const statusEl = document.getElementById('status-message');
      const table = document.getElementById('users-table');

      const user = await getCurrentUserAsync();

      if (!user) {
        statusEl.textContent = 'Not logged in.';
        return;
      }

      // Fetch the user's profile to check role
      const { data: profile, error } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (error) {
        console.error(error);
        statusEl.textContent = 'Error loading profile.';
        return;
      }

      if (profile.role !== 'admin') {
        statusEl.textContent = 'Access denied: Admins only.';
        return;
      }

      // Admin confirmed
      statusEl.style.display = 'none';
      table.style.display = 'table';

      initAdminPanel();
    })();
  </script>
</body>
</html>
