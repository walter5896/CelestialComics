<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem 1rem; text-align: left; }
    th { background: #f4f4f4; }
    select, button { padding: 0.25rem; }
  </style>
</head>
<body>
  <h1>Admin Panel</h1>
  <p id="status-message">Loading...</p>

  <table id="users-table" style="display:none;">
    <thead>
      <tr>
        <th>Email</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Load env first so Supabase client works -->
  <script src="/js/env.js"></script>

  <script type="module">
    import { getCurrentUserAsync } from '../js/auth.js';

    (async () => {
      const user = await getCurrentUserAsync();
      const statusEl = document.getElementById('status-message');
      const table = document.getElementById('users-table');
      const tbody = table.querySelector('tbody');

      if (!user) {
        statusEl.textContent = 'Not logged in.';
        return;
      }

      // Check if user is admin by calling Netlify function
      const res = await fetch('/.netlify/functions/get-users');
      const users = await res.json();
      const currentUserProfile = users.find(u => u.id === user.id);

      if (!currentUserProfile || currentUserProfile.role !== 'admin') {
        statusEl.textContent = 'Access denied: Admins only.';
        return;
      }

      // Admin logged in
      statusEl.style.display = 'none';
      table.style.display = 'table';

      // Render users
      tbody.innerHTML = '';
      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>
            <select>
              <option value="user" ${u.role==='user'?'selected':''}>user</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
            </select>
            <button data-user-id="${u.id}">Update</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    })();
  </script>
</body>
</html>
