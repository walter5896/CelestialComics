<!-- admin/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f9fafb; color: #111827; line-height: 1.6; }
    a { text-decoration: none; color: inherit; }

    nav { background: #1f2937; color: #f9fafb; padding: 0.75rem 1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    nav h1 { font-size: 1.25rem; font-weight: 600; }
    nav ul { list-style: none; display: flex; gap: 1rem; }
    nav ul li a { padding: 0.5rem 0.75rem; border-radius: 0.375rem; transition: background 0.2s; }
    nav ul li a:hover { background: #374151; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    #status-message { margin-bottom: 1rem; font-size: 1rem; text-align: center; }

    table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    th, td { padding: 0.75rem 1rem; text-align: left; }
    th { background: #e5e7eb; font-weight: 600; }
    tr:nth-child(even) { background: #f9fafb; }
    tr:hover { background: #f3f4f6; }

    select, button {
      padding: 0.4rem 0.6rem;
      border-radius: 0.375rem;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    button:hover { background: #1d4ed8; }

    .voting-section {
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .voting-section h2 {
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      nav ul { flex-direction: column; width: 100%; margin-top: 0.5rem; }
      table, th, td { font-size: 0.9rem; }
      button, select { font-size: 0.85rem; }
    }

    @media (max-width: 480px) {
      table { font-size: 0.8rem; }
      th, td { padding: 0.5rem; }
    }
  </style>
</head>
<body>

  <nav>
    <h1>Admin Panel</h1>
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li><a href="/admin/index.html">Admin</a></li>
      <li><a href="#" id="logout-link">Logout</a></li>
    </ul>
  </nav>

  <div class="container">
    <p id="status-message">Loading...</p>

    <!-- USER MANAGEMENT -->
    <table id="users-table" style="display:none;">
      <thead>
        <tr>
          <th>Email</th>
          <th>Role</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- VOTING CONTROLS -->
    <div class="voting-section" id="voting-section" style="display:none;">
      <h2>Voting Controls</h2>
      <button id="determine-winner-btn">Determine Winner</button>
    </div>
  </div>

  <script src="/js/env.js"></script>

  <script type="module">
    import { getCurrentUserAsync, logout } from '../js/auth.js';

    const statusEl = document.getElementById('status-message');
    const table = document.getElementById('users-table');
    const tbody = table.querySelector('tbody');
    const votingSection = document.getElementById('voting-section');
    const determineWinnerBtn = document.getElementById('determine-winner-btn');

    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
      window.location.href = '/';
    });

    async function determineWinner() {
      try {
        const res = await fetch('/.netlify/functions/determine-winner', {
          method: 'POST'
        });

        const result = await res.json();

        if (!res.ok) throw new Error(result.error || 'Unknown error');

        if (result.success) {
          alert(`Winner determined!\n\nStory ID: ${result.winner_id}\nVotes: ${result.vote_count}`);
        } else {
          alert(result.message);
        }

      } catch (err) {
        console.error('Error determining winner:', err);
        alert('Failed to determine winner. Check console.');
      }
    }

    determineWinnerBtn.addEventListener('click', determineWinner);

    (async () => {
      const user = await getCurrentUserAsync();

      if (!user) {
        statusEl.textContent = 'Not logged in.';
        return;
      }

      let users = [];
      try {
        const res = await fetch('/.netlify/functions/get-users');
        users = await res.json();
      } catch (err) {
        console.error('Failed to fetch users:', err);
        statusEl.textContent = 'Error loading users.';
        return;
      }

      const currentUserProfile = users.find(u => u.id === user.id);
      if (!currentUserProfile || currentUserProfile.role !== 'admin') {
        statusEl.textContent = 'Access denied: Admins only.';
        return;
      }

      statusEl.style.display = 'none';
      table.style.display = 'table';
      votingSection.style.display = 'block';

      tbody.innerHTML = '';
      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>
            <select>
              <option value="user" ${u.role==='user'?'selected':''}>user</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
            </select>
            <button data-user-id="${u.id}">Update</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      tbody.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', async () => {
          const userId = button.dataset.userId;
          const select = button.previousElementSibling;
          const newRole = select.value;

          try {
            const res = await fetch('/.netlify/functions/update-user-role', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId, role: newRole, requesterId: user.id })
            });

            const result = await res.json();
            if (result.success) {
              button.closest('tr').querySelector('td:nth-child(2)').textContent = newRole;
              button.style.background = '#10b981';
              setTimeout(() => button.style.background = '#2563eb', 800);
            } else {
              alert(`Error: ${result.error}`);
            }
          } catch (err) {
            console.error('Error updating role:', err);
            alert('Error updating role.');
          }
        });
      });

    })();
  </script>
</body>
</html>
