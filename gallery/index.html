<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Name | Gallery</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li class="profile-link" style="display:none;">
            <a href="/profile/">My Profile</a>
          </li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="page-container">
    <section class="gallery">
      <div class="container">
        <h1>Gallery</h1>
        <p>Browse all the stories submitted by our community. Click any story to view details.</p>

        <div id="story-grid" class="story-grid"></div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- MODULE SCRIPT -->
  <script type="module">
    import { updateUI, logout } from '/js/auth.js';
    import {
      fetchStoriesWithVotes,
      fetchUserVotes,
      renderStories,
      submitVote,
      saveStory,
      updateVoteButtons
    } from '/js/vote.js';

    document.addEventListener('DOMContentLoaded', async () => {
      updateUI();

      document.querySelectorAll('.logout-link').forEach(el => {
        el.addEventListener('click', async e => {
          e.preventDefault();
          await logout();
        });
      });

      const storyGrid = document.getElementById('story-grid');
      if (!storyGrid) return;

      async function initGallery() {
        try {
          const stories = await fetchStoriesWithVotes();
          const userVotes = await fetchUserVotes();

          const storiesWithFlag = stories.map(s => ({ ...s, isSaved: false }));

          renderStories(storiesWithFlag, 'story-grid', { showSaveButton: true, isSavedContext: false });
          updateVoteButtons(userVotes, stories);

          storyGrid.addEventListener('click', async e => {
            if (e.target.matches('.vote-btn')) {
              const btn = e.target;
              const storyId = btn.dataset.storyId;
              const success = await submitVote(storyId);
              if (!success) return;

              await initGallery();
            } else if (e.target.matches('.save-btn')) {
              const btn = e.target;
              const storyId = btn.dataset.storyId;
              const result = await saveStory(storyId);
              if (result.success) btn.textContent = 'Saved';
            }
          });

        } catch (err) {
          console.error('Error loading gallery stories:', err);
          storyGrid.innerHTML = '<p class="error">Failed to load stories.</p>';
        }
      }

      initGallery();
    });
  </script>
</body>
</html>
