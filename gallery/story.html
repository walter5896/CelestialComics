<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Name | Story</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-container">
    <a href="/" class="logo">PROJECT LOGO</a>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span class="hamburger"></span>
    </button>
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="/">Home</a></li>
        <li><a href="/gallery/">Gallery</a></li>
        <li><a href="/vote/">Vote</a></li>
        <li><a href="/shop/">Shop</a></li>
        <li><a href="/team/">Team</a></li>
        <li class="profile-link" style="display:none;">
          <a href="/profile/">My Profile</a>
        </li>
        <li><a href="/login/" class="login-link">Login</a></li>
        <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="content-wrapper">

  <div class="story-back">
    <a href="/gallery/" class="btn btn-secondary">← Back to Gallery</a>
  </div>

  <section class="story-hero">
    <div class="container">
      <h1 class="story-title">Loading...</h1>
      <p class="story-meta"></p>
      <img src="" alt="" class="story-hero-img" />
    </div>
  </section>

  <section class="story-body">
    <div class="container">
      <div class="story-content">
        <p>Loading story content...</p>
      </div>

      <div class="story-cta">
        <button class="btn btn-primary vote-btn">Vote for this story</button>
        <button class="btn btn-secondary save-btn">Save Story</button>
      </div>
    </div>
  </section>

  <section class="related-stories">
    <div class="container">
      <h2>Other Stories You Might Like</h2>
      <div id="related-stories-grid" class="story-grid"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-container">
    <p>&copy; 2025 Project Name. All rights reserved.</p>
  </div>
</footer>

<script src="/js/env.js"></script>
<script type="module" src="/js/utils.js"></script>

<script type="module">
  import { updateUI, logout } from '/js/auth.js';
  import { loadStory } from '/js/story.js';
  import {
    fetchStoriesWithVotes,
    renderStoriesForHome,
    fetchSavedStories,
    saveStory
  } from '/js/vote.js';
  import { handleVoteButtonState } from '/js/votingStateControl.js';

  document.addEventListener('DOMContentLoaded', async () => {
    updateUI();

    document.querySelectorAll('.logout-link').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
        location.reload();
      });
    });

    // Load main story
    const story = await loadStory();
    if (!story) return;

    const storyId = story.id;

    // Get saved stories to check if this story is already saved
    const savedResult = await fetchSavedStories();
    const savedStories = savedResult.success ? savedResult.data : [];
    const alreadySaved = savedStories.some(s => String(s.id) === String(storyId));

    // Vote button
    const voteBtn = document.querySelector('.vote-btn');
    await handleVoteButtonState(voteBtn, storyId); // disables if voting closed

    voteBtn.addEventListener('click', async () => {
      // check again in case voting period changed
      const canVote = await handleVoteButtonState(voteBtn, storyId);
      if (!canVote) return;

      // proceed with voting
      const { submitVote } = await import('/js/vote.js'); // dynamic import
      const success = await submitVote(storyId);
      if (success) {
        voteBtn.disabled = true;
        voteBtn.textContent = 'Voted';
      }
    });

    // Save button
    const saveBtn = document.querySelector('.save-btn');
    if (alreadySaved) {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Already Saved';
    }

    saveBtn.addEventListener('click', async () => {
      const result = await saveStory(storyId);
      if (result.success) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saved';
      } else if (result.reason === 'already_saved') {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Already Saved';
      } else {
        alert('Failed to save story.');
      }
    });

    // Related stories (read-only)
    const stories = await fetchStoriesWithVotes();
    const relatedStories = stories.filter(s => s.id !== storyId);
    renderStoriesForHome(relatedStories, 'related-stories-grid');
  });
</script>

</body>
</html>
