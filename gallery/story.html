<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Name | Story</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="/" class="logo">PROJECT LOGO</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="/">Home</a></li>
          <li><a href="/gallery/">Gallery</a></li>
          <li><a href="/vote/">Vote</a></li>
          <li><a href="/shop/">Shop</a></li>
          <li><a href="/team/">Team</a></li>
          <li class="profile-link" style="display:none;"><a href="/profile/">My Profile</a></li>
          <li><a href="/login/" class="login-link">Login</a></li>
          <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- STORY CONTENT -->
  <main class="content-wrapper">
    <div class="story-back">
      <a href="/gallery/" class="btn btn-secondary">← Back to Gallery</a>
    </div>

    <section class="story-hero">
      <div class="container">
        <h1 class="story-title">Loading...</h1>
        <p class="story-meta"></p>
        <img src="" alt="" class="story-hero-img" />
      </div>
    </section>

    <section class="story-body">
      <div class="container">
        <div class="story-content">
          <p>Loading story content...</p>
        </div>
        <div class="story-cta">
          <button class="btn btn-primary vote-btn">Vote for this story</button>
          <button class="btn btn-secondary save-btn">Save Story</button>
        </div>
      </div>
    </section>

    <section class="related-stories">
      <div class="container">
        <h2>Other Stories You Might Like</h2>
        <div id="related-stories-grid" class="story-grid">
          <!-- Populated dynamically -->
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>&copy; 2025 Project Name. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="/gallery/">Gallery</a> |
        <a href="/vote/">Vote</a> |
        <a href="/shop/">Shop</a> |
        <a href="/team/">Team</a>
      </nav>
    </div>
  </footer>

  <!-- ENV -->
  <script src="/js/env.js"></script>

  <!-- APP LOGIC -->
  <script type="module">
    import { updateUI, logout } from '/js/auth.js';
    import { getQueryParam, loadStory, saveStory, submitVote } from '/js/story.js';
    import { fetchStoriesWithVotes, renderStories, fetchUserVotes, updateVoteButtons } from '/js/vote.js';

    // Update header based on auth
    updateUI();
    document.querySelectorAll('.logout-link').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.preventDefault();
        await logout();
      });
    });

    document.addEventListener('DOMContentLoaded', async () => {
      // 1️⃣ Load the main story
      await loadStory();

      const storyId = getQueryParam('id');
      if (!storyId) return;

      // 2️⃣ Setup vote button
      const voteBtn = document.querySelector('.story-cta .vote-btn');
      voteBtn.dataset.storyId = storyId;
      voteBtn.addEventListener('click', async () => {
        const success = await submitVote(storyId);
        if (success) {
          voteBtn.disabled = true;
          voteBtn.textContent = 'Voted';
        }
      });

      // 3️⃣ Setup save button
      const saveBtn = document.querySelector('.story-cta .save-btn');
      saveBtn.dataset.storyId = storyId;
      saveBtn.addEventListener('click', async () => {
        const success = await saveStory(storyId);
        if (success) {
          saveBtn.disabled = true;
          saveBtn.textContent = 'Saved';
        }
      });

      // 4️⃣ Load related stories
      const stories = await fetchStoriesWithVotes();
      const relatedStories = stories.filter(s => s.id !== storyId);
      renderStories(relatedStories, 'related-stories-grid');

      // 5️⃣ Update vote buttons for related stories
      const userVotes = await fetchUserVotes();
      updateVoteButtons(userVotes, relatedStories);
    });
  </script>
</body>
</html>
