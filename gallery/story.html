<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Name | Story</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<header class="site-header">
  <div class="container header-container">
    <a href="/" class="logo">PROJECT LOGO</a>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span class="hamburger"></span>
    </button>
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="/">Home</a></li>
        <li><a href="/gallery/">Gallery</a></li>
        <li><a href="/vote/">Vote</a></li>
        <li><a href="/shop/">Shop</a></li>
        <li><a href="/team/">Team</a></li>
        <li class="profile-link" style="display:none;"><a href="/profile/">My Profile</a></li>
        <li class="admin-link" style="display:none;"><a href="/admin/index.html">Admin Panel</a></li>
        <li><a href="/login/" class="login-link">Login</a></li>
        <li><a href="#" class="logout-link" style="display:none">Logout</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="content-wrapper">

  <div class="story-back">
    <a href="/gallery/" class="btn btn-secondary">← Back to Gallery</a>
  </div>

  <section class="story-hero">
    <div class="container">
      <h1 class="story-title">Loading...</h1>
      <p class="story-meta"></p>
      <img src="" alt="" class="story-hero-img" />
    </div>
  </section>

  <section class="story-body">
    <div class="container">
      <div class="story-content"><p>Loading story content...</p></div>

      <div class="story-cta">
        <a id="read-full-story-btn" href="#" class="btn btn-primary">Read Full Story</a>
        <button class="btn btn-primary vote-btn" data-story-id="">Vote for this story</button>
        <button class="btn btn-secondary save-btn" data-story-id="">Save Story</button>
      </div>
    </div>
  </section>

  <section class="related-stories">
    <div class="container">
      <h2>Other Stories You Might Like</h2>
      <div id="related-stories-grid" class="story-grid"></div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-container">
    <p>&copy; 2025 Project Name. All rights reserved.</p>
  </div>
</footer>

<script src="/js/env.js"></script>
<script type="module" src="/js/utils.js"></script>

<script type="module">
import { updateUI, logout } from '/js/auth.js';
import { loadStory } from '/js/story.js';
import { fetchStoriesWithVotes, renderStoriesForHome, fetchSavedStories, submitVote, saveStory } from '/js/vote.js';
import { restrictSingleStoryVoting } from '/js/singleStoryRestrict.js';

document.addEventListener('DOMContentLoaded', async () => {
  updateUI();

  document.querySelectorAll('.logout-link').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
      location.reload();
    });
  });

  const story = await loadStory();
  if (!story) return;
  const storyId = story.id;

  const storiesWithVotes = await fetchStoriesWithVotes();
  const fullStory = storiesWithVotes.find(s => String(s.id) === String(storyId));
  if (fullStory) {
    story.voting_status = fullStory.voting_status;
    story.vote_count = fullStory.vote_count;
  }

  document.querySelector('.story-title').textContent = story.title || 'Untitled Story';
  document.querySelector('.story-meta').textContent = story.author || '';

  const heroImg = document.querySelector('.story-hero-img');
  heroImg.src = story.cover_image_url || story.image_url || '';
  heroImg.alt = story.title || 'Story cover';

  const storyContent = document.querySelector('.story-content');
  storyContent.innerHTML = `<p>${story.description || 'No story description available yet.'}</p>`;

  const readFullStoryBtn = document.getElementById('read-full-story-btn');
  readFullStoryBtn.href = `/gallery/read.html?id=${storyId}`;

  const voteBtn = document.querySelector('.vote-btn');
  voteBtn.dataset.storyId = storyId;
  voteBtn.dataset.voteCount = story.vote_count || 0;

  const saveBtn = document.querySelector('.save-btn');
  saveBtn.dataset.storyId = storyId;

  await restrictSingleStoryVoting(story, voteBtn);

  voteBtn.addEventListener('click', async () => {
    if (voteBtn.disabled) return;

    const originalText = voteBtn.textContent;
    voteBtn.disabled = true;
    voteBtn.textContent = 'Submitting...';

    try {
      const result = await submitVote(storyId, 1);

      if (result.success) {
        story.vote_count = (story.vote_count || 0) + 1;
        voteBtn.dataset.voteCount = story.vote_count;
        voteBtn.disabled = false;
        voteBtn.textContent = `Add Vote (${story.vote_count})`;
      } else if (result.reason === 'insufficient_balance') {
        voteBtn.textContent = `No Votes Left (${story.vote_count || 0})`;
      } else {
        voteBtn.disabled = false;
        voteBtn.textContent = originalText;
      }
    } catch (err) {
      console.error('Single story vote error:', err);
      voteBtn.disabled = false;
      voteBtn.textContent = originalText;
    }
  });

  const savedResult = await fetchSavedStories();
  const savedStories = savedResult.success ? savedResult.data : [];
  const alreadySaved = savedStories.some(s => String(s.id) === String(storyId));

  if (alreadySaved) {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Already Saved';
  }

  saveBtn.addEventListener('click', async () => {
    if (saveBtn.disabled) return;

    const originalText = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
      const result = await saveStory(storyId);

      if (result.success) {
        saveBtn.textContent = 'Saved';
      } else if (result.reason === 'already_saved') {
        saveBtn.textContent = 'Already Saved';
      } else {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
        alert('Failed to save story.');
      }
    } catch (err) {
      console.error('Save story error:', err);
      saveBtn.disabled = false;
      saveBtn.textContent = originalText;
      alert('Failed to save story.');
    }
  });

  const stories = await fetchStoriesWithVotes();
  const relatedStories = stories.filter(s => s.id !== storyId);
  renderStoriesForHome(relatedStories, 'related-stories-grid');
});
</script>

<script type="module" src="/js/admin-nav.js"></script>

</body>
</html>
